name: Build N1

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_version_612:
        description: "6.12系列内核版本号"
        required: true
        default: "6.12.110"
        type: string
      kernel_version_618:
        description: "6.18系列内核版本号"
        required: true
        default: "6.18.52"
        type: string

env:
  TZ: Asia/Shanghai
  PACKIT_DIR: /opt/openwrt_packit
  KERNEL_DIR: /opt/kernel
  ROOTFS_URL: https://github.com/MXJNZ6/op/releases/download/N1/immortalwrt-armsr-armv8-generic-rootfs.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build for ${{ matrix.flippy_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - flippy_name: k6.12
            kernel_version_input: ${{ github.event.inputs.kernel_version_612 }}
          - flippy_name: k6.18
            kernel_version_input: ${{ github.event.inputs.kernel_version_618 }}

    env:
      KERNEL_VERSION_RAW: ${{ matrix.kernel_version_input }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "FILE_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

          sudo mkdir -p "$KERNEL_DIR" "$PACKIT_DIR"
          sudo chown -R "$USER:$USER" "$KERNEL_DIR" "$PACKIT_DIR"

          git clone --depth 1 \
            https://github.com/unifreq/openwrt_packit \
            "$PACKIT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            btrfs-progs \
            dosfstools \
            gawk \
            pigz \
            unzip \
            uuid-runtime \
            xz-utils \
            zip

      - name: Download kernel
        shell: bash
        run: |
          set -euo pipefail

          kernel_archive="$KERNEL_DIR/${KERNEL_VERSION_RAW}.tar.gz"
          kernel_url="https://github.com/ophub/kernel/releases/download/kernel_flippy/${KERNEL_VERSION_RAW}.tar.gz"

          echo "下载内核：$kernel_url"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --output "$kernel_archive" \
            "$kernel_url"

          echo "验证内核压缩包..."
          sudo tar -tzf "$kernel_archive" >/dev/null

          echo "解压内核..."
          sudo tar \
            -xzf "$kernel_archive" \
            -C "$KERNEL_DIR" \
            --strip-components=1

          echo "内核文件列表："
          sudo find "$KERNEL_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Detect kernel version
        shell: bash
        run: |
          set -euo pipefail

          module_file="$(
            find "$KERNEL_DIR" \
              -maxdepth 1 \
              -type f \
              -name "modules-${KERNEL_VERSION_RAW}-flippy-*.tar.gz" \
              -print -quit
          )"

          if [[ -z "$module_file" ]]; then
            echo "错误：没有找到 modules 文件"
            exit 1
          fi

          module_name="$(basename "$module_file")"
          kernel_version="${module_name#modules-}"
          kernel_version="${kernel_version%.tar.gz}"

          echo "检测到实际内核版本：$kernel_version"

          required_files=(
            "$KERNEL_DIR/modules-${kernel_version}.tar.gz"
            "$KERNEL_DIR/boot-${kernel_version}.tar.gz"
            "$KERNEL_DIR/dtb-amlogic-${kernel_version}.tar.gz"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "错误：缺少文件 $file"
              exit 1
            fi
          done

          echo "KERNEL_VERSION=$kernel_version" >> "$GITHUB_ENV"

      - name: Download rootfs
        shell: bash
        working-directory: ${{ env.PACKIT_DIR }}
        run: |
          set -euo pipefail

          rootfs_file="openwrt-armsr-armv8-generic-rootfs.tar.gz"

          echo "下载 rootfs：$ROOTFS_URL"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --output "$rootfs_file" \
            "$ROOTFS_URL"

          test -s "$rootfs_file"

          echo "rootfs 文件信息："
          ls -lh "$rootfs_file"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PACKIT_DIR/tmp"
          sudo mount -t tmpfs none "$PACKIT_DIR/tmp"

          cd "$PACKIT_DIR"

          required_files=(
            "$KERNEL_DIR/modules-${KERNEL_VERSION}.tar.gz"
            "$KERNEL_DIR/boot-${KERNEL_VERSION}.tar.gz"
            "$KERNEL_DIR/dtb-amlogic-${KERNEL_VERSION}.tar.gz"
            "$PACKIT_DIR/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "错误：缺少文件 $file"
              exit 1
            fi
          done

          echo "生成 whoami 文件..."

          cat > whoami <<EOF
            WHOAMI="Akatsuki"
            OPENWRT_VER="R26.10.1"
            DISTRIB_DESCRIPTION="Unicorn"
            KERNEL_VERSION="${KERNEL_VERSION}"
          EOF

          echo "whoami 文件内容："
          cat whoami

          echo "开始打包镜像..."
          sudo ./mk_s905d_n1.sh

          sudo cp \
            files/openwrt-update-amlogic \
            output/openwrt-update-amlogic

      - name: Compress output
        shell: bash
        working-directory: ${{ env.PACKIT_DIR }}/output
        run: |
          set -euo pipefail

          sudo pigz -9 -p 2 *

          echo "构建产物："
          ls -lah

      - name: Check disk usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload firmware artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@main
        with:
          name: "OpenWrt_${{ matrix.flippy_name }}_${{ env.FILE_DATE }}_${{ env.KERNEL_VERSION_RAW }}"
          path: ${{ env.PACKIT_DIR }}/output

      - name: Create release
        if: ${{ !cancelled() }}
        uses: ncipollo/release-action@v1
        with:
          name: openwrt_s905d_n1-imm-flippy
          allowUpdates: true
          tag: s905d_n1
          commit: master
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            This is OpenWrt firmware for N1

            * Firmware information
            Default IP地址: 10.10.10.254
            Default username: root
            Default password: 无/password
            Default WIFI name: Phicomm_n1
            Default WIFI password: password
          artifacts: ${{ env.PACKIT_DIR }}/output/*

  over:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Telegram notification
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=主人，N1盒子OpenWrt系统打包成功啦！"

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
